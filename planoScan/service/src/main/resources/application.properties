server.port=8082
spring.application.name=planoscan
spring.config.import=optional:application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.photo-storage=${PHOTO_STORAGE:local}
cloudinary.url=${CLOUDINARY_URL:}

jwt.secret=${JWT_SECRET:planoscan-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
jwt.expiration=86400000

app.admin.email=${ADMIN_EMAIL:admin@planoscan.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.name=${ADMIN_NAME:Admin}

gemini.api.key=${GEMINI_API_KEY:test}
gemini.model=gemini-flash-latest
scoring.flag-threshold=90
scoring.max-attempts=3

logging.level.com.example.demo.ai.GeminiAiClient=DEBUG

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:planoscan.notify@gmail.com}
sendgrid.from-name=${SENDGRID_FROM_NAME:PlanoScan}
